name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and Unzip Project Archive
        run: |
          # Ищем любой .zip файл в корне репозитория
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Распаковываем архив: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
            # Если внутри архива оказалась одноименная папка, переносим содержимое в корень
            DIR_NAME=$(basename "$ZIP_FILE" .zip)
            if [ -d "$DIR_NAME" ]; then
              cp -r "$DIR_NAME"/* .
            fi
          else
            echo "ZIP-архив не найден, собираем из исходников в репозитории"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Setup Gradle Action
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
